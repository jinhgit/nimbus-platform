spring:
  application:
    name: nimbus-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nimbus}
    username: ${DB_USER:nimbus}
    password: ${DB_PASSWORD:nimbus}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      # Redis 없어도 기동 (토큰은 인메모리 폴백)
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

nimbus:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  auth:
    # free-only 로컬 기본: Dev Login 활성. GitHub OAuth 설정 시 병행 가능
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL:3600}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL:604800}
    jwt-secret: ${JWT_SECRET:nimbus-local-dev-secret-change-me-32bytes-min}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    frontend-callback: ${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

logging:
  level:
    root: INFO
    io.nimbus.platform: DEBUG
