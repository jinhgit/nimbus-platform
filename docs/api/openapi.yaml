openapi: 3.0.3
info:
  title: Nimbus Platform API
  description: |
    AI Native Internal Developer Platform REST API (핵심 엔드포인트 스냅샷).
    상세 시나리오 스펙은 docs/api/API-*.md 를 함께 본다.
    저장소 소스: docs/api/openapi.yaml · 런타임 서빙: classpath:openapi.yaml (동기화 필수).
  version: 0.3.0
  contact:
    name: Nimbus Platform

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Workspaces
  - name: Projects
  - name: Services
  - name: Environments
  - name: AI
  - name: Deployments
  - name: Wizard
  - name: Audit

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: API health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/auth/dev-login:
    post:
      tags: [Auth]
      summary: Dev login (local free-only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user (includes workspaceRole, canMutate)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/auth/permissions:
    get:
      tags: [Auth]
      summary: Workspace permissions (canMutate, permission codes)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/auth/workspace:
    patch:
      tags: [Auth]
      summary: Switch current workspace (re-issues tokens)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId]
              properties:
                workspaceId: { type: string, format: uuid }
      responses:
        "200":
          description: New tokens

  /api/v1/dashboard/overview:
    get:
      tags: [Dashboard]
      summary: Dashboard widgets (env count, promotes, failed sagas, audit)
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List my workspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace summaries
    post:
      tags: [Workspaces]
      summary: Create workspace
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Created

  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Workspaces]
      summary: List workspace members
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Members

  /api/v1/workspaces/{workspaceId}/members/invite:
    post:
      tags: [Workspaces]
      summary: Invite member by email (auto-create local user if missing)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [ADMIN, PLATFORM_ENGINEER, DEVELOPER, VIEWER]
      responses:
        "200":
          description: Invited member

  /api/v1/workspaces/{workspaceId}/members/{memberId}:
    patch:
      tags: [Workspaces]
      summary: Update member role (e.g. VIEWER)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [ADMIN, PLATFORM_ENGINEER, DEVELOPER, VIEWER]
      responses:
        "200":
          description: Updated member
    delete:
      tags: [Workspaces]
      summary: Remove member
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project list
    post:
      tags: [Projects]
      summary: Create project (mutator only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, workspaceId]
              properties:
                name: { type: string }
                workspaceId: { type: string, format: uuid }
                description: { type: string }
      responses:
        "200":
          description: Created

  /api/v1/services:
    get:
      tags: [Services]
      summary: List services
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Service list

  /api/v1/services/{serviceId}:
    get:
      tags: [Services]
      summary: Get service
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Service

  /api/v1/services/{serviceId}/environments:
    get:
      tags: [Environments]
      summary: List environments (auto-ensure default)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Environment list
    post:
      tags: [Environments]
      summary: Create environment (mutator)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [DEV, STAGE, PRODUCTION]
      responses:
        "200":
          description: Created

  /api/v1/services/{serviceId}/promotions:
    get:
      tags: [Environments]
      summary: Promotion history (includes thin GitOps meta)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Promotions with gitOpsMode / PR fields

  /api/v1/environments/{environmentId}/variables:
    get:
      tags: [Environments]
      summary: List variables
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Variables
    post:
      tags: [Environments]
      summary: Create variable (mutator)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Created

  /api/v1/environments/{environmentId}/secrets:
    get:
      tags: [Environments]
      summary: List secrets (masked)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Masked secrets
    post:
      tags: [Environments]
      summary: Create secret (mutator)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Created

  /api/v1/environments/{environmentId}/promote:
    post:
      tags: [Environments]
      summary: Promote DEV→STAGE or STAGE→PRODUCTION (+ thin GitOps)
      description: |
        Copies variables/secrets, records promotion.
        GitOps: always records head/base branch; creates PR when SCM+repo work;
        otherwise gitOpsMode=SIMULATED or BRANCH_RECORDED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  enum: [STAGE, PRODUCTION]
      responses:
        "200":
          description: Promote result with gitOpsMode, branches, optional PR

  /api/v1/environments/{environmentId}/secrets/sync-github:
    post:
      tags: [Environments]
      summary: Thin GitHub Actions secret sync
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/environmentId"
      responses:
        "200":
          description: Sync result (SIMULATED / SIMULATED_LIVE / LIVE)

  /api/v1/services/{serviceId}/deployments:
    get:
      tags: [Deployments]
      summary: Deployment history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Deployments

  /api/v1/services/{serviceId}/timeline:
    get:
      tags: [Deployments]
      summary: Service timeline (deployments + promotions)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/serviceId"
      responses:
        "200":
          description: Timeline

  /api/v1/ai/yaml/explain:
    post:
      tags: [AI]
      summary: YAML Explain (rule-engine)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                kind:
                  type: string
                  enum: [AUTO, DEPLOYMENT, SERVICE, HELM, ARGO, ACTIONS, TERRAFORM, INGRESS, GENERIC]
                serviceName: { type: string }
                environmentType:
                  type: string
                  enum: [DEV, STAGE, PRODUCTION]
      responses:
        "200":
          description: Explain result with highlights, risks, suggestions

  /api/v1/ai/recommend:
    post:
      tags: [AI]
      summary: Runtime/DB/Cache recommendation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recommendation

  /api/v1/service-wizard:
    post:
      tags: [Wizard]
      summary: Create service wizard session (mutator)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wizard created

  /api/v1/service-wizard/{wizardId}:
    get:
      tags: [Wizard]
      summary: Get wizard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wizardId"
      responses:
        "200":
          description: Wizard

  /api/v1/service-wizard/{wizardId}/execute:
    post:
      tags: [Wizard]
      summary: Start provision saga (mutator)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wizardId"
      responses:
        "200":
          description: jobId = sagaId

  /api/v1/service-wizard/{wizardId}/retry:
    post:
      tags: [Wizard]
      summary: Retry failed provision (mutator)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wizardId"
      responses:
        "200":
          description: New saga attempt

  /api/v1/service-wizard/{wizardId}/saga:
    get:
      tags: [Wizard]
      summary: Latest provision saga with steps
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wizardId"
      responses:
        "200":
          description: Saga detail

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: Audit log search
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit list

  /v3/api-docs:
    get:
      tags: [Health]
      summary: OpenAPI YAML snapshot
      security: []
      responses:
        "200":
          description: openapi.yaml body

  /api/v1/pipelines/github-runs:
    get:
      tags: [Deployments]
      summary: Thin GitHub Actions workflow runs (LIVE or SIMULATED)
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: GitHub runs snapshot

  /api/v1/incidents:
    get:
      tags: [Deployments]
      summary: List incidents
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Incidents

  /api/v1/incidents/counts:
    get:
      tags: [Deployments]
      summary: Incident status counts
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Counts

  /api/v1/incidents/scan:
    post:
      tags: [Deployments]
      summary: Scan failed sagas/pipelines/envs into incidents
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Scan result

  /api/v1/incidents/{incidentId}/acknowledge:
    post:
      tags: [Deployments]
      summary: Acknowledge incident
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated

  /api/v1/incidents/{incidentId}/resolve:
    post:
      tags: [Deployments]
      summary: Resolve incident
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated

  /api/v1/ai/status:
    get:
      tags: [AI]
      summary: AI provider status (rule | ollama)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider status


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    serviceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    environmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    wizardId:
      name: wizardId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

security:
  - bearerAuth: []
