spring:
  datasource:
    url: jdbc:h2:mem:nimbus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

nimbus:
  auth:
    dev-login-enabled: true
    jwt-secret: test-secret-key-for-nimbus-platform-jwt-32b
  cors:
    allowed-origins: http://localhost:3000
  k8s:
    # 테스트는 클러스터 없이 시뮬레이션 경로
    enabled: false
  pipeline:
    # 테스트 종료 후 비동기 파이프라인 H2 레이스 방지
    auto-on-wizard: false

logging:
  level:
    root: WARN
