spring:
  application:
    name: nimbus-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nimbus}
    username: ${DB_USER:nimbus}
    password: ${DB_PASSWORD:nimbus}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      # Redis 없어도 기동 (토큰은 인메모리 폴백)
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true

nimbus:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  auth:
    # free-only 로컬 기본: Dev Login 활성. GitHub OAuth 설정 시 병행 가능
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL:3600}
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL:604800}
    jwt-secret: ${JWT_SECRET:nimbus-local-dev-secret-change-me-32bytes-min}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    # 로그인 OAuth
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    frontend-callback: ${FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}
    # SCM 연결 OAuth (repo 권한) — GitHub OAuth App 에 callback 등록 필요
    scm-redirect-uri: ${GITHUB_SCM_REDIRECT_URI:http://localhost:8080/api/v1/github/oauth/callback}
    scm-frontend-callback: ${GITHUB_SCM_FRONTEND_CALLBACK:http://localhost:3000/settings}
    scm-scopes: ${GITHUB_SCM_SCOPES:repo workflow read:user user:email}
  k8s:
    enabled: ${K8S_ENABLED:true}
    # empty = default ~/.kube/config
    kubeconfig: ${KUBECONFIG:}
    # free-only: block EKS/GKE/AKS contexts
    strict-local: ${K8S_STRICT_LOCAL:true}
    demo-image: ${K8S_DEMO_IMAGE:nginx:1.27-alpine}
    deploy-timeout-seconds: ${K8S_DEPLOY_TIMEOUT:90}
  observability:
    prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}
    grafana-url: ${GRAFANA_URL:http://localhost:3001}
    loki-url: ${LOKI_URL:http://localhost:3100}
    demo-metrics-when-unavailable: true
  pipeline:
    auto-on-wizard: ${PIPELINE_AUTO_ON_WIZARD:true}
  ai:
    # rule (default) | ollama — Ollama down 시 자동 rule fallback
    provider: ${AI_PROVIDER:rule}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llama3.2}
    ollama-timeout-ms: ${OLLAMA_TIMEOUT_MS:8000}

logging:
  level:
    root: INFO
    io.nimbus.platform: DEBUG
