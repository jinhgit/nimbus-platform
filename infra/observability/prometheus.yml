global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nimbus-api"
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal: Mac Docker Desktop → 호스트 API
      - targets: ["host.docker.internal:8080"]
